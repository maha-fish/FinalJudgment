// main: the Forge 1.20.1 mod — entry point, Core/Attack/Defense/Client/Network layers.
// ENV_SPEC section 3 (module layout), section 4.1 (main jar), section 9 (module build deps).
//
// NOTE (decision taken during prep, see report): main's build directory is mapped onto the root
// build/ directory so the artifact lands exactly at build/libs/finaljudgment-<version>.jar,
// as required by ENV_SPEC section 4.1 and the section 15 verification checklist.
//
// NOTE (deferred to Unit 6): ENV_SPEC section 9 requires this module's compileJava/processResources
// to dependOn ':agent:jar', ':native:compileNative', ':bootstrap:jar' and to embed those artifacts
// into META-INF/agent, META-INF/native, META-INF/bootstrap. That wiring is deliberately not added
// yet: the native module has no .c sources before Unit 2, so :native:compileNative cannot run.
//
// NOTE (deferred to Unit 11b): the org.spongepowered.mixin plugin and the
// mixin { add sourceSets.main, 'finaljudgment.refmap.json'; config 'finaljudgment.mixins.json' }
// block are declared in the root build script (apply false) and applied once the mixin config exists.
// NOTE (Unit 11b): MixinGradle 已启用，refmap 由 annotationProcessor 生成。
// 与参考项目一致：plugins 里声明 + 这里 apply + mixin { add sourceSets.main, ... }。
plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

// refmap：把 dev 的 MCP 名映射到生产 SRG 名（没有它，生产环境 @Accessor 会 apply 失败）
mixin {
    add sourceSets.main, 'finaljudgment.refmap.json'
    config 'finaljudgment.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

layout.buildDirectory.set(rootProject.layout.buildDirectory)

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // Channel: official — Official field/method names from Mojang mapping files.
    mappings channel: mapping_channel, version: mapping_version

    // Required by the MDK template so IDE runs see processed resources.
    copyIdeResources = true

    runs {
        configureEach {
            // ENV_SPEC section 14: dev logs live at <project>/run/logs/latest.log.
            workingDirectory rootProject.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // ===== coremod 分档开关（当前测试档：只开 Entity 守卫）=====
            // 可选项（逐个往上加，验证一个再加下一个）：
            //   fj.coremod.patch            ← 总闸，必须开
            //   fj.coremod.patch.entity     ← Entity: setRemoved / remove / discard（当前已开）
            //   fj.coremod.patch.livingentity ← LivingEntity: setHealth / hurt / kill / die
            //   fj.coremod.patch.serverplayer ← ServerPlayer: die / dropEquipment
            //   fj.coremod.patch.serverlevel  ← ServerLevel: removeEntityComplete
            //   fj.coremod.patch.tickhook     ← Entity.tick → CoremodKillTicker（每 tick 反射，最后才开）
            // 目前全部关闭：实测 Entity 守卫在运行时抛 NoClassDefFoundError（game 层解析不到
            // mod 层的 common/KillFlag），被 try-catch 吞掉后导致 setRemoved 不执行
            // → 生物死亡不消失、持续掉战利品。等 KillFlag 迁到 coremod 后再逐档开启。
            // Unit 11b：dev 环境没有 jar manifest，Mixin 配置需显式告知
            property 'mixin.configs', 'finaljudgment.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory rootProject.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Unit 11b：refmap 生成器（必须与运行时 mixin 版本一致）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ENV_SPEC section 3: main 依赖 common / native / agent / bootstrap（不依赖 coremod）
    implementation project(':common')
    // bootstrap 只能编译期存在：运行期由 Native 注入 Bootstrap CL，散在主 jar 里会造成重复
    compileOnly project(':bootstrap')

    // ENV_SPEC section 7：main 用 implementation 独立 ASM（common 的 SRGNames 签名引用 ASM 类型，
    // 缺了它会在运行期 NoClassDefFoundError: common/SRGNames —— 已实测踩坑）
    implementation 'org.ow2.asm:asm:9.5'
    implementation 'org.ow2.asm:asm-tree:9.5'
}

// ENV_SPEC section 9: main 的 compileJava / processResources 必须依赖 agent / native / bootstrap。
tasks.named('compileJava').configure {
    dependsOn ':agent:jar', ':native:compileNative', ':bootstrap:jar'
}

// Expands ${...} placeholders in mods.toml / pack.mcmeta from gradle.properties.
tasks.named('processResources', ProcessResources).configure {
    dependsOn ':agent:jar', ':native:compileNative', ':bootstrap:jar'

    from(tasks.getByPath(':agent:jar').archiveFile) {
        into 'META-INF/agent'
        rename { 'finaljudgment-agent.jar' }
    }
    from(rootProject.layout.projectDirectory.dir('native/build/native')) {
        into 'META-INF/native'
    }
    from(tasks.getByPath(':bootstrap:jar').archiveFile) {
        into 'META-INF/bootstrap'
        rename { 'finaljudgment-bootstrap.jar' }
    }

    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version            : mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// 开发环境把 coremod jar 放到 run/mods/（FML 只扫 mods/ 根目录）
tasks.register('stageCoremod', Copy) {
    dependsOn ':coremod:jar'
    from(tasks.getByPath(':coremod:jar').archiveFile)
    into rootProject.layout.projectDirectory.dir('run/mods')
}

// runClient/runServer 由 ForgeGradle 在配置后创建，必须延后绑定
afterEvaluate {
    tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
        dependsOn 'stageCoremod'
    }
}

tasks.named('jar', Jar).configure {
    // 生产环境用户只放两个 jar → common 的类必须打进主 jar（开发期走 classpath 亦可）
    from(project(':common').sourceSets.main.output)

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Unit 11b：让 Forge 的 Mixin 服务加载我们的配置（无需 MixinGradle 插件）
                'MixinConfigs'            : 'finaljudgment.mixins.json'
        ])
    }

    // Reobfuscate the jar for production (SRG names).
    finalizedBy 'reobfJar'
}
